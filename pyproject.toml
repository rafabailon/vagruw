[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vagruw"
version = "0.1.0"
description = "Generate reproducible Vagrant labs for Wazuh and automate installation and lifecycle management."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vagruw contributors"}]
keywords = ["vagrant", "wazuh", "siem", "virtualbox", "libvirt", "lab", "security"]
classifiers = [
"Development Status :: 4 - Beta",
"Environment :: Console",
"Intended Audience :: System Administrators",
"License :: OSI Approved :: MIT License",
"Operating System :: POSIX :: Linux",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Topic :: System :: Systems Administration",
"Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
vagruw = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
"cli",
"config",
"constants",
"generator",
"model",
"orchestrator",
"paths",
"runner",
"wazuh",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
